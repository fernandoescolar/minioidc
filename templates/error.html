{{ define "title" }}{{ .Title }} · {{ .Name }}{{ end }}
{{ define "content" }}
<div class="stack text-center">
    <div>
        <p class="text-sm font-semibold text-indigo-600 dark:text-indigo-400">{{ .Status }}</p>
        <h1 class="page-title mt-1">{{ .Title }}</h1>
        <p class="page-subtitle">{{ .Message }}</p>
    </div>
    <a class="btn-secondary btn-block" href="{{ basePath }}/">Go to your account</a>
</div>
{{ end }}
